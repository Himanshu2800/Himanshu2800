name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 GitHub Overview
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: Himanshu2800
          template: classic
          config_timezone: Asia/Kolkata

          base: header, activity, community, repositories

          output_action: none

      - name: 📅 Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: Himanshu2800
          template: classic
          config_timezone: Asia/Kolkata

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          output_action: none

      - name: 🈷️ Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: Himanshu2800
          template: classic
          config_timezone: Asia/Kolkata

          base: ""

          plugin_languages: yes
          plugin_languages_limit: 8

          output_action: none

      - name: 💾 Commit generated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-metrics.svg
          git add metrics-isocalendar.svg
          git add metrics-languages.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub metrics"
            git push origin HEAD:main
          fi
